# ClarityBS — full stack on one KVM.
#   1. sudo bash scripts/harden.sh        (AFTER adding your SSH key!)
#   2. curl -fsSL https://get.docker.com | sh
#   3. mkdir -p /opt/claritybs /data/reports && copy this repo there
#   4. cp .env.example .env  && fill in secrets
#   5. docker compose up -d --build
#   6. docker compose exec api npx tsx scripts/init-db.ts
#   7. docker compose exec api npx tsx scripts/seed.ts you@example.com "Dt. Name" 'password'

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api]

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_WA_NUMBER: ${NEXT_PUBLIC_WA_NUMBER}
        NEXT_PUBLIC_DIETICIAN: ${NEXT_PUBLIC_DIETICIAN}
        API_INTERNAL_URL: http://api:8000
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000
      NODE_ENV: production

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PORT: "8000"
    command: >
      sh -c "npx tsx scripts/init-db.ts && node dist/server.js"
    depends_on: [db]
    volumes:
      - /data/reports:/reports

  worker:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    command: node dist/jobs/scheduler.js
    depends_on: [db, api]

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  caddy_data:
  caddy_config:
  pgdata:
